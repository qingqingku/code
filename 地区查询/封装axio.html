<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>封装_简易axios函数_获取省份列表</title>
</head>

<body>
  <p></p>
  <script>
    /**
     * 目标：封装_简易axios函数_获取省份列表
     *  1. 定义myAxios函数，接收配置对象，返回Promise对象
     *  2. 发起XHR请求，默认请求方法为GET
     *  3. 调用成功/失败的处理程序
     *  4. 使用myAxios函数，获取省份列表展示
    */
   function myaxios(config) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest()
      if(config.params){
        const paramsObj = new URLSearchParams(config.params)
        const queryString = paramsObj.toString()
        config.url += `?${queryString}`//携带了查询参数
      }
      xhr.open(config.method || 'GET', config.url)
      xhr.addEventListener('loadend',() => {
        if(xhr.status >= 200 && xhr.status < 300){
          resolve(JSON.parse(xhr.response))
        }else{
          reject(new Error(xhr.response))
        }
      })
      if(config.data){
        const jsonStr = JSON.stringify(config.data)
        xhr.setRequestHeader('Content-Type','application/json')//请求头
        xhr.send(jsonStr)//请求参数，传请求体
      }else{
        xhr.send()
      }
    })
   }
   myaxios({
    url: 'http://hmajax.itheima.net/api/area',
    params: {
      pname: "北京",
      cname: "北京市"
    }
   }).then(result =>{
    console.log(result)
    document.querySelector('p').innerHTML = result.list.join('<br>')
   }).catch(error => {
    console.dir(error)
    document.querySelector('p').innerHTML = error.message
   })
  </script>
</body>

</html>
